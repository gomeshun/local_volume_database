name: Refresh external catalog caches

on:
  workflow_dispatch:
    inputs:
      refresh_vizier:
        description: "Fetch VizieR entries missing from the committed cache"
        required: true
        type: boolean
        default: true
      simbad_mode:
        description: "SIMBAD refresh scope"
        required: true
        type: choice
        default: missing
        options:
          - none
          - missing
          - retry-bad
          - force

concurrency:
  group: refresh-external-catalog-caches
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Refresh VizieR
        if: ${{ inputs.refresh_vizier }}
        working-directory: web
        run: npm run refresh:vizier

      - name: Refresh missing SIMBAD entries
        if: ${{ inputs.simbad_mode == 'missing' }}
        working-directory: web
        run: npm run refresh:simbad

      - name: Retry incomplete SIMBAD entries
        if: ${{ inputs.simbad_mode == 'retry-bad' }}
        working-directory: web
        run: npm run refresh:simbad:retry-bad

      - name: Re-fetch all SIMBAD entries
        if: ${{ inputs.simbad_mode == 'force' }}
        working-directory: web
        run: npm run refresh:simbad:force

      - name: Regenerate deterministic public data
        working-directory: web
        run: npm run prepare:data

      - name: Commit refreshed caches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/generated/vizier_catalogs.json web/src/generated/vizier_catalogs.ts
          git add web/src/generated/simbad_mappings.json web/src/generated/simbad_mappings.ts
          if git diff --cached --quiet; then
            echo "No cache changes to commit"
          else
            git commit -m "chore(catalogs): refresh external caches [skip ci]"
            git push origin HEAD
          fi
