name: Update Vizier cache

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-fetch all SIMBAD entries (sets FORCE_SIMBAD=1)'
        required: false
        default: 'false'
      retry_bad:
        description: 'Retry previously fetched entries missing results (sets RETRY_BAD=1)'
        required: false
        default: 'false'

concurrency:
  group: update-vizier-cache
  cancel-in-progress: true

jobs:
  update-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (web)
        working-directory: web
        run: npm ci
        # run: |
        #   cd web
        #   npm ci

      - name: Show selected inputs
        run: |
          echo "Inputs: force=${{ inputs.force }} retry_bad=${{ inputs.retry_bad }}"
          if [ "${{ inputs.force }}" = 'true' ]; then echo "FORCE_SIMBAD=1"; else echo "FORCE_SIMBAD=0"; fi
          if [ "${{ inputs.retry_bad }}" = 'true' ]; then echo "RETRY_BAD=1"; else echo "RETRY_BAD=0"; fi

      - name: Generate datasets and Vizier cache
        working-directory: web
        env:
          FORCE_SIMBAD: ${{ inputs.force == 'true' && '1' || '0' }}
          RETRY_BAD: ${{ inputs.retry_bad == 'true' && '1' || '0' }}
        run: npm run prepare:data

      - name: Commit and push updated cache (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Add generated cache files (be conservative)
          git add web/src/generated/vizier_catalogs.json web/src/generated/vizier_catalogs.ts || true
          # Detect changes
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore(vizier): update cache [skip ci]" || echo "commit failed"
            git push origin HEAD
            echo "Pushed updated Vizier cache"
          else
            echo "No cache changes to commit"
          fi
